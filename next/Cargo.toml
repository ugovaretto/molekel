[workspace]
members = ["crates/molekel-core", "crates/molekel-format", "crates/molekel-import", "crates/molekel-convert", "crates/molekel-wasm", "app/src-tauri"]
default-members = ["crates/molekel-core", "crates/molekel-format", "crates/molekel-import", "crates/molekel-convert", "crates/molekel-wasm"]
resolver = "2"

[workspace.package]
version = "0.3.1"
edition = "2024"
license = "GPL-2.0-or-later"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
