[workspace]
members = ["crates/eigenvista-core", "crates/eigenvista-format", "crates/eigenvista-import", "crates/eigenvista-convert", "crates/eigenvista-wasm", "app/src-tauri"]
default-members = ["crates/eigenvista-core", "crates/eigenvista-format", "crates/eigenvista-import", "crates/eigenvista-convert", "crates/eigenvista-wasm"]
resolver = "2"

[workspace.package]
version = "0.4.0"
edition = "2024"
license = "GPL-2.0-or-later"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
